<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIA'O - Deudas y Pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-800 min-h-screen flex items-center justify-center p-4">

    <!-- Pantalla de Autenticación -->
    <div id="auth-screen" class="w-full max-w-4xl bg-[#b92b27] rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 text-white">
        <div class="p-8 md:p-12 flex flex-col justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-wider mb-6 flex items-center gap-2">FIA<span class="text-yellow-400">’O</span></h1>
                <h2 class="text-2xl md:text-3xl font-extrabold leading-tight mb-4">Mantén tu negocio en movimiento.</h2>
                <p class="text-red-100 text-sm mb-8">Una forma clara de manejar fiados, pagos y clientes del día a día.</p>
            </div>
        </div>
        <div class="bg-amber-50 text-neutral-800 p-8 md:p-12 flex flex-col justify-center">
            <h2 class="text-xl font-bold text-neutral-800 mb-4">Inicia sesión</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-neutral-600 uppercase mb-1">Correo</label>
                    <input type="email" id="email" required placeholder="tu@correo.com" class="w-full px-4 py-3 rounded-xl border border-neutral-300 focus:outline-none focus:ring-2 focus:ring-red-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres" class="w-full px-4 py-3 rounded-xl border border-neutral-300 focus:outline-none focus:ring-2 focus:ring-red-600 text-sm">
                </div>
                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-xl transition shadow-lg">
                    Iniciar sesión
                </button>
            </form>
            <div class="mt-6 text-center">
                <button onclick="loginDemo()" class="text-xs font-bold text-red-700 hover:underline">¿Solo quieres probar? Entrar con cuenta demo</button>
            </div>
        </div>
    </div>

    <!-- Panel Principal -->
    <div id="dashboard-screen" class="hidden w-full max-w-4xl bg-white rounded-3xl shadow-2xl p-8 text-neutral-800">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-red-700">Panel de Control - FIA'O</h2>
            <button onclick="logout()" class="bg-neutral-200 hover:bg-neutral-300 text-neutral-800 font-semibold px-4 py-2 rounded-xl text-sm transition">Cerrar Sesión</button>
        </div>
        <p class="text-neutral-600 mb-6">¡Bienvenido! Has ingresado correctamente al sistema.</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-red-50 p-4 rounded-2xl border border-red-100">
                <span class="text-xs text-red-600 font-bold uppercase">Total por Cobrar</span>
                <p class="text-2xl font-extrabold text-red-800">$0.00</p>
            </div>
            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                <span class="text-xs text-amber-600 font-bold uppercase">Clientes Registrados</span>
                <p class="text-2xl font-extrabold text-amber-800">0</p>
            </div>
            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                <span class="text-xs text-emerald-600 font-bold uppercase">Estado del Sistema</span>
                <p class="text-sm font-bold text-emerald-700 mt-1">✓ Activo en línea</p>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            localStorage.setItem('fiao_logged', 'true');
            showApp();
        }
        function loginDemo() {
            localStorage.setItem('fiao_logged', 'true');
            showApp();
        }
        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }
        function logout() {
            localStorage.removeItem('fiao_logged');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
        window.onload = function() {
            if (localStorage.getItem('fiao_logged')) {
                showApp();
            }
        }
    </script>
</body>
</html>
